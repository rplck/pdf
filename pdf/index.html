<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Cleaner</title>
<style>
:root{--bg:#f3f4f6;--surface:#fff;--ink:#14161a;--muted:#6b7280;--line:#dcdfe4;--accent:#1f4fd8;--on:#fff;--del:#d93a2f;--delbg:rgba(217,58,47,.14);--ok:#1a8a4a;
box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--surface:#1f2228;--ink:#eceef2;--muted:#9aa1ad;--line:#333842;--accent:#6b93ff;--on:#0b1020;--del:#ff6a5e;--delbg:rgba(255,106,94,.18);--ok:#4cc38a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181c;--surface:#1f2228;--ink:#eceef2;--muted:#9aa1ad;--line:#333842;--accent:#6b93ff;--on:#0b1020;--del:#ff6a5e;--delbg:rgba(255,106,94,.18);--ok:#4cc38a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px 10px;padding:10px 14px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line)}
.file{display:flex;flex-direction:column;min-width:0;max-width:260px;line-height:1.25;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
.file:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.file b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file span{font-size:12px;color:var(--muted)}
.range{display:flex;gap:6px;flex:0 1 340px;min-width:0}
.range input{flex:1;min-width:0;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.actions{display:flex;gap:8px;margin-left:auto}
.btn{min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
@media (hover:hover){.btn:hover:not(:disabled){border-color:var(--muted)}.card:hover{background:var(--surface)}}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.danger:not(:disabled){color:var(--del);border-color:var(--del)}
:is(.btn,input,.card):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grid{flex:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr));gap:14px 12px;align-content:start}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 6px;border-radius:10px;border:2px solid transparent;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.thumb{position:relative;width:100%;aspect-ratio:1/1.414;background:#fff;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.thumb canvas{width:100%;height:100%;display:block}
.num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card.sel{border-color:var(--del);background:var(--delbg)}
.card.sel .thumb{opacity:.55}
.card.sel .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--del) calc(50% - 1.5px),var(--del) calc(50% + 1.5px),transparent calc(50% + 1.5px))}
.card.sel .num{color:var(--del);font-weight:600}
.empty{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;gap:12px;border:2px dashed var(--line);border-radius:16px;padding:20px}
.empty h1{margin:0;font-size:clamp(24px,6vw,32px);font-weight:650;letter-spacing:-.02em}
.empty p{margin:0;color:var(--muted);line-height:1.6;max-width:36ch}
footer{padding:8px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface);min-height:34px;overflow-wrap:anywhere}
footer.error{color:var(--del)}footer.ok{color:var(--ok)}
.drop{position:fixed;inset:10px;display:none;place-items:center;text-align:center;padding:16px;font-size:20px;font-weight:600;background:color-mix(in srgb,var(--accent) 14%,var(--bg));border:3px dashed var(--accent);border-radius:16px;pointer-events:none;z-index:10}
.drop.on{display:grid}
.zoom{position:absolute;top:6px;right:6px;z-index:2;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:rgba(20,22,26,.78);color:#fff;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.zoom svg{width:18px;height:18px}
@media (hover:hover){.zoom{opacity:0}.card:hover .zoom,.card:focus-within .zoom,.zoom:focus-visible{opacity:1}}
@media (pointer:coarse){.zoom{width:38px;height:38px}}
.viewer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:rgba(8,10,14,.82);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.vnum{font-size:14px;font-weight:600;margin-right:auto;font-variant-numeric:tabular-nums}
.vnum.sel{color:var(--del)}
.vbody{flex:1;min-height:0;display:flex;align-items:stretch}
.vstage{flex:1;min-width:0;min-height:0;display:grid;place-items:center;padding:12px;overflow:hidden}
.vstage canvas{background:#fff;border-radius:3px;box-shadow:0 4px 24px rgba(0,0,0,.5);display:block}
.nav{flex:none;width:56px;border:0;background:transparent;color:#fff;font-size:40px;cursor:pointer;touch-action:manipulation}
.nav:disabled{opacity:.25;cursor:default}
.nav:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
@media (max-width:640px){.nav{width:36px;font-size:30px}.vstage{padding:6px}.vbar{padding:8px 10px}.vbar .btn{padding:8px 10px}}
@media (max-width:640px){
  .bar{padding:8px 10px}
  .file{flex:1;max-width:none}
  .range{order:3;flex:1 1 100%}
  .actions{order:4;flex:1 1 100%;margin-left:0}
  .actions .btn{flex:1;padding-inline:8px}
  main{padding:10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,100px),1fr));gap:10px 8px}
  .card{padding:5px 5px 4px}
}
@media (max-height:480px) and (orientation:landscape){.bar{padding:6px 10px}.btn,.range input{min-height:34px}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <button class="btn" id="openBtn" type="button">Открыть PDF</button>
  <button class="file" id="file" type="button" hidden title="Открыть другой PDF"><b id="fname"></b><span id="fcount"></span></button>
  <form class="range" id="rangeForm" hidden>
    <input id="rangeInput" placeholder="Номера: 2, 5, 8-12" aria-label="Номера страниц" autocomplete="off" inputmode="text" enterkeyhint="go">
    <button class="btn" type="submit">Выбрать</button>
  </form>
  <div class="actions">
    <button class="btn danger" id="delBtn" type="button" hidden>Удалить выбранные</button>
    <button class="btn" id="undoBtn" type="button" hidden>Отменить</button>
    <button class="btn primary" id="saveBtn" type="button" hidden>Сохранить PDF</button>
  </div>
</header>
<main id="main">
  <div class="empty" id="empty">
    <h1>PDF Cleaner</h1>
    <p>Перетащите PDF в окно или нажмите «Открыть PDF». Файл обрабатывается прямо в вашем браузере и никуда не отправляется.</p>
    <button class="btn primary" id="openBtn2" type="button">Открыть PDF</button>
  </div>
  <div class="grid" id="grid" hidden></div>
</main>
<footer id="status" role="status" aria-live="polite"></footer>
<div class="drop" id="drop">Отпустите, чтобы открыть PDF</div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Просмотр страницы" hidden>
  <div class="vbar">
    <span class="vnum" id="vnum"></span>
    <button class="btn" id="vsel" type="button"></button>
    <button class="btn" id="vclose" type="button">Закрыть ✕</button>
  </div>
  <div class="vbody">
    <button class="nav" id="vprev" type="button" aria-label="Предыдущая страница">‹</button>
    <div class="vstage" id="vstage"></div>
    <button class="nav" id="vnext" type="button" aria-label="Следующая страница">›</button>
  </div>
</div>
<input type="file" id="fileInput" accept=".pdf,application/pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Воркер уже загружен скриптом выше (pdf.js использует его в основном потоке); URL нужен только как запасной вариант
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdf = null, bytes = null, fileName = "", pages = [], hist = [], sel = new Set();
let cards = new Map(), gen = 0, busy = false, anchor = null, loading = false;

const io = new IntersectionObserver((es) => es.forEach((e) => {
  if (e.isIntersecting) { io.unobserve(e.target); enqueue(e.target); }
}), { root: $("main"), rootMargin: "400px" });

// Рендер миниатюр по очереди, чтобы интерфейс не зависал
const queue = []; let running = false;
function enqueue(card) { queue.push({ card, g: gen }); if (!running) run(); }
async function run() {
  running = true;
  while (queue.length) {
    const { card, g } = queue.shift();
    if (g !== gen) continue;
    try {
      const page = await pdf.getPage(card._i + 1);
      if (g !== gen) { page.cleanup(); continue; }
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (180 / base.width) * Math.min(window.devicePixelRatio || 1, 2) });
      const c = card.querySelector("canvas");
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      card.querySelector(".thumb").style.aspectRatio = `${vp.width} / ${vp.height}`;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      page.cleanup();
    } catch (e) { /* миниатюра не отрисовалась — страница всё равно останется в файле */ }
    await new Promise((r) => setTimeout(r)); // отдаём управление интерфейсу
  }
  running = false;
}

function say(text, kind = "") { const s = $("status"); s.textContent = text; s.className = kind; }

function parseRanges(input, total) {
  const text = input.trim().replace(/\s*([-–—])\s*/g, "$1"); // «8 - 12» → «8-12»
  if (!text) return { error: "Введите номера страниц, например: 2, 5, 8-12" };
  const out = new Set();
  for (const part of text.split(/[,;\s]+/).filter(Boolean)) {
    const m = part.match(/^(\d+)(?:[-–—](\d+))?$/);
    if (!m) return { error: `Не удалось разобрать «${part}»` };
    const a = +m[1], b = m[2] !== undefined ? +m[2] : a;
    if (a < 1 || b < 1) return { error: "Нумерация начинается с 1" };
    if (a > b) return { error: `Диапазон «${part}» задан в обратном порядке` };
    if (b > total) return { error: `В документе только ${total} стр.` };
    for (let i = a; i <= b; i++) out.add(i);
  }
  return { pages: [...out].sort((x, y) => x - y) };
}

function makeCard(i) {
  const b = document.createElement("div");
  b.className = "card"; b._i = i; b.tabIndex = 0; b.setAttribute("role", "button");
  b.innerHTML = '<div class="thumb"><canvas></canvas><button type="button" class="zoom" title="Увеличить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 8v5M8 10.5h5"/></svg></button></div><span class="num"></span>';
  b.querySelector(".zoom").onclick = (e) => { e.stopPropagation(); openViewer(i, e.currentTarget); };
  b.onkeydown = (e) => { if (e.target === b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); b.click(); } };
  b.onclick = (e) => {
    if (e.shiftKey && anchor !== null && pages.includes(anchor)) {
      // Shift+клик — выбрать диапазон от последней отмеченной страницы
      const a = pages.indexOf(anchor), z = pages.indexOf(i);
      for (let k = Math.min(a, z); k <= Math.max(a, z); k++) sel.add(pages[k]);
    } else {
      sel.has(i) ? sel.delete(i) : sel.add(i);
    }
    anchor = i;
    refreshSel();
  };
  io.observe(b);
  return b;
}

// Обновляет только состояние выбора (без перестановки узлов)
function refreshSel() {
  for (const i of pages) {
    const c = cards.get(i), on = sel.has(i);
    if (c.classList.contains("sel") !== on) { c.classList.toggle("sel", on); c.setAttribute("aria-pressed", on); }
  }
  $("delBtn").textContent = "Удалить выбранные" + (sel.size ? ` (${sel.size})` : "");
  $("delBtn").disabled = sel.size === 0;
}

function render() {
  const grid = $("grid");
  const keep = new Set(pages);
  for (const [i, c] of cards) if (!keep.has(i) && c.parentNode) c.remove();
  pages.forEach((i, pos) => {
    const c = cards.get(i);
    c.setAttribute("aria-label", `Страница ${pos + 1}`);
    c.setAttribute("aria-pressed", sel.has(i));
    c.classList.toggle("sel", sel.has(i));
    c.querySelector(".num").textContent = pos + 1;
    c.querySelector(".zoom").setAttribute("aria-label", `Увеличить страницу ${pos + 1}`);
    grid.appendChild(c); // переставляет существующий узел, миниатюра не рисуется заново
  });
  $("fcount").textContent = `${pages.length} из ${pdf.numPages} стр.`;
  $("undoBtn").disabled = hist.length === 0;
  $("saveBtn").disabled = busy || pages.length === pdf.numPages;
  refreshSel();
}

async function load(file) {
  if (!file || loading) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") return say("Выберите файл в формате PDF.", "error");
  loading = true; say("Открываю…");
  try {
    const b = new Uint8Array(await file.arrayBuffer());
    const doc = await pdfjsLib.getDocument({ data: b.slice() }).promise;
    if (pdf) pdf.destroy();
    gen++; queue.length = 0;
    pdf = doc; bytes = b; fileName = file.name;
    pages = Array.from({ length: doc.numPages }, (_, i) => i);
    hist = []; sel = new Set(); anchor = null;
    cards.forEach((c) => (io.unobserve(c), c.remove())); cards = new Map();
    pages.forEach((i) => cards.set(i, makeCard(i)));
    $("fname").textContent = file.name; $("fname").title = file.name; $("rangeInput").value = "";
    closeViewer(); $("empty").hidden = true; $("empty").style.display = "none"; $("grid").hidden = false;
    $("openBtn").hidden = true; // кнопка «Открыть PDF» больше не нужна: другой файл открывается по клику на имя или перетаскиванием
    for (const id of ["file", "rangeForm", "delBtn", "undoBtn", "saveBtn"]) $(id).hidden = false;
    $("main").scrollTop = 0;
    render();
    say("Нажимайте на страницы, чтобы выбрать ненужные");
  } catch (e) {
    const m = `${e && e.name} ${e && e.message}`;
    say(/password/i.test(m) ? "Файл защищён паролем — такие PDF не поддерживаются."
      : /Invalid PDF|InvalidPDF|header/i.test(m) ? "Не удалось прочитать файл: он повреждён или это не PDF."
      : "Ошибка: " + (e && e.message || e), "error");
  } finally { loading = false; }
}

function deleteSelected() {
  if (!pdf || busy || !sel.size) return;
  if (sel.size >= pages.length) return say("Нельзя удалить все страницы документа.", "error");
  const n = sel.size;
  hist.push(pages); pages = pages.filter((i) => !sel.has(i)); sel = new Set(); anchor = null;
  $("rangeInput").value = ""; render(); say(`Удалено страниц: ${n}`);
}
function undo() {
  if (!pdf || busy || !hist.length) return;
  pages = hist.pop(); sel = new Set(); anchor = null; render(); say("Последнее удаление отменено");
}

// Сохранение файла: на iPhone <a download> открывает PDF в просмотрщике, поэтому используем меню «Поделиться»
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
async function saveBlob(blob, filename) {
  const file = new File([blob], filename, { type: "application/pdf" });
  if (isIOS() && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) {
      if (e && e.name === "AbortError") return; // юзер закрыл меню
      // Safari мог потерять «жест пользователя» после долгой обработки — просим нажать ещё раз
      await new Promise((resolve) => {
        const st = $("status");
        st.innerHTML = "";
        const b = document.createElement("button");
        b.textContent = "Нажми, чтобы сохранить: " + filename;
        b.style.cssText = "padding:10px 16px;font-size:16px;border-radius:10px;border:0;background:#2563eb;color:#fff";
        b.onclick = async () => {
          try { await navigator.share({ files: [file] }); } catch (e2) {}
          resolve();
        };
        st.appendChild(b);
      });
      return;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

async function savePdf() {
  if (busy) return;
  busy = true; render(); say("Готовлю файл…");
  try {
    const src = await PDFLib.PDFDocument.load(bytes, { updateMetadata: false });
    const out = await PDFLib.PDFDocument.create();
    (await out.copyPages(src, pages)).forEach((p) => out.addPage(p)); // страницы копируются как есть, без растеризации
    const blob = new Blob([await out.save()], { type: "application/pdf" });
    const filename = fileName.replace(/\.pdf$/i, "") + "_cleaned.pdf";
    let dl = null;
    try { dl = window.claude && (await claude.use("downloads")); } catch (e) {}
    if (dl) await dl.save({ filename, data: blob });
    else await saveBlob(blob, filename);
    say(`Сохранено: ${filename} (${pages.length} стр.)`, "ok");
  } catch (e) {
    if (e && e.code === "declined") say("Сохранение отменено");
    else say("Не удалось сохранить: " + (e && e.message || e), "error");
  } finally { busy = false; render(); }
}

// Крупный просмотр страницы
let vPos = -1, vTok = 0, vTask = null, vFrom = null, vRs = 0;
function openViewer(i, from) {
  const pos = pages.indexOf(i); if (pos < 0) return;
  vPos = pos; vFrom = from || null;
  $("viewer").hidden = false;
  $("bar").inert = $("main").inert = $("status").inert = true;
  $("vclose").focus();
  showViewer();
}
function closeViewer() {
  if ($("viewer").hidden) return;
  $("viewer").hidden = true; vTok++;
  if (vTask) { vTask.cancel(); vTask = null; }
  $("vstage").replaceChildren();
  $("bar").inert = $("main").inert = $("status").inert = false;
  if (vFrom && vFrom.isConnected) vFrom.focus();
  vFrom = null;
}
function stepViewer(d) {
  const n = vPos + d;
  if (n < 0 || n >= pages.length) return;
  vPos = n; showViewer();
}
function updateViewerBar() {
  const on = sel.has(pages[vPos]);
  $("vnum").textContent = `Страница ${vPos + 1} из ${pages.length}` + (on ? " · выбрана" : "");
  $("vnum").classList.toggle("sel", on);
  $("vsel").textContent = on ? "Снять выбор" : "Выбрать для удаления";
  $("vprev").disabled = vPos === 0; $("vnext").disabled = vPos === pages.length - 1;
}
async function showViewer() {
  updateViewerBar();
  const tok = ++vTok;
  if (vTask) { vTask.cancel(); vTask = null; }
  try {
    const page = await pdf.getPage(pages[vPos] + 1);
    if (tok !== vTok) return;
    const st = $("vstage"), cs = getComputedStyle(st), base = page.getViewport({ scale: 1 });
    const aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const fit = Math.max(0.1, Math.min(aw / base.width, ah / base.height));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const vp = page.getViewport({ scale: fit * dpr });
    const c = document.createElement("canvas"); // рисуем в новый canvas и подменяем после отрисовки — без мерцания
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.width = Math.floor(base.width * fit) + "px"; c.style.height = Math.floor(base.height * fit) + "px";
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    vTask = page.render({ canvasContext: ctx, viewport: vp });
    await vTask.promise;
    if (tok !== vTok) return;
    st.replaceChildren(c);
  } catch (e) { /* отменённая отрисовка — просто пропускаем */ }
}
$("vclose").onclick = closeViewer;
$("vprev").onclick = () => stepViewer(-1); $("vnext").onclick = () => stepViewer(1);
$("vsel").onclick = () => {
  const i = pages[vPos]; sel.has(i) ? sel.delete(i) : sel.add(i);
  anchor = i; refreshSel(); updateViewerBar();
};
$("vstage").onclick = (e) => { if (e.target === $("vstage")) closeViewer(); };
let tx = null;
$("vstage").addEventListener("touchstart", (e) => { tx = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
$("vstage").addEventListener("touchend", (e) => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) stepViewer(dx < 0 ? 1 : -1);
}, { passive: true });
addEventListener("resize", () => { if (!$("viewer").hidden) { clearTimeout(vRs); vRs = setTimeout(showViewer, 150); } });

const pick = () => $("fileInput").click();
$("openBtn").onclick = $("openBtn2").onclick = $("file").onclick = pick;
$("fileInput").onchange = (e) => { load(e.target.files[0]); e.target.value = ""; };
$("delBtn").onclick = deleteSelected; $("undoBtn").onclick = undo; $("saveBtn").onclick = savePdf;
$("rangeForm").onsubmit = (e) => {
  e.preventDefault();
  if (!pdf) return;
  const r = parseRanges($("rangeInput").value, pages.length);
  if (r.error) return say(r.error, "error");
  sel = new Set(r.pages.map((n) => pages[n - 1])); anchor = null; refreshSel(); say(`Выбрано страниц: ${r.pages.length}`);
};

// Перетаскивание: реагируем только на файлы
const isFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
let depth = 0;
addEventListener("dragenter", (e) => { if (!isFiles(e)) return; e.preventDefault(); depth++; $("drop").classList.add("on"); });
addEventListener("dragleave", (e) => { if (!isFiles(e)) return; if (--depth <= 0) { depth = 0; $("drop").classList.remove("on"); } });
addEventListener("dragover", (e) => { if (isFiles(e)) e.preventDefault(); });
addEventListener("drop", (e) => {
  if (!isFiles(e)) return;
  e.preventDefault(); depth = 0; $("drop").classList.remove("on"); load(e.dataTransfer.files[0]);
});
addEventListener("keydown", (e) => {
  if (!$("viewer").hidden) {
    if (e.key === "Escape") { e.preventDefault(); closeViewer(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); stepViewer(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); stepViewer(1); }
    return;
  }
  if (!pdf || e.target.tagName === "INPUT") return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
  else if (e.key === "Delete" || e.key === "Backspace") { if (sel.size) { e.preventDefault(); deleteSelected(); } }
  else if (e.key === "Escape" && sel.size) { sel = new Set(); anchor = null; refreshSel(); }
});
</script>
