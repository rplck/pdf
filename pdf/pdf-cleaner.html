<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Cleaner</title>
<style>
:root{--bg:#f3f4f6;--surface:#fff;--ink:#14161a;--muted:#6b7280;--line:#dcdfe4;--accent:#1f4fd8;--del:#d93a2f;--delbg:rgba(217,58,47,.14);--ok:#1a8a4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--surface:#1f2228;--ink:#eceef2;--muted:#9aa1ad;--line:#333842;--accent:#6b93ff;--del:#ff6a5e;--delbg:rgba(255,106,94,.18);--ok:#4cc38a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181c;--surface:#1f2228;--ink:#eceef2;--muted:#9aa1ad;--line:#333842;--accent:#6b93ff;--del:#ff6a5e;--delbg:rgba(255,106,94,.18);--ok:#4cc38a;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line)}
.bar[hidden],.file[hidden]{display:none}
.file{display:flex;flex-direction:column;min-width:0;max-width:200px;line-height:1.25}
.file b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file span{font-size:12px;color:var(--muted)}
.range{display:flex;gap:6px;margin-right:auto}
.range input{width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--muted)}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger:not(:disabled){color:var(--del);border-color:var(--del)}
:is(.btn,input,.card):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;overflow:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px 12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 6px;border-radius:10px;border:2px solid transparent}
.card:hover{background:var(--surface)}
.thumb{position:relative;width:100%;aspect-ratio:1/1.414;background:#fff;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.thumb canvas{width:100%;height:100%;display:block}
.num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card.sel{border-color:var(--del);background:var(--delbg)}
.card.sel .thumb{opacity:.55}
.card.sel .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--del) calc(50% - 1.5px),var(--del) calc(50% + 1.5px),transparent calc(50% + 1.5px))}
.card.sel .num{color:var(--del);font-weight:600}
.empty{height:100%;display:grid;place-content:center;justify-items:center;text-align:center;gap:10px;border:2px dashed var(--line);border-radius:16px;padding:20px}
.empty h1{margin:0;font-size:28px;font-weight:650;letter-spacing:-.02em}
.empty p{margin:0;color:var(--muted);line-height:1.6;max-width:36ch}
footer{padding:8px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface);min-height:34px}
footer.error{color:var(--del)}footer.ok{color:var(--ok)}
.drop{position:fixed;inset:10px;display:none;place-items:center;font-size:20px;font-weight:600;background:color-mix(in srgb,var(--accent) 14%,var(--bg));border:3px dashed var(--accent);border-radius:16px;pointer-events:none}
.drop.on{display:grid}
</style>
</head>
<body>
<header class="bar" id="bar">
  <button class="btn" id="openBtn">Открыть PDF</button>
  <div class="file" id="file" hidden><b id="fname"></b><span id="fcount"></span></div>
  <form class="range" id="rangeForm" hidden>
    <input id="rangeInput" placeholder="Номера: 2, 5, 8-12" aria-label="Номера страниц" autocomplete="off">
    <button class="btn" type="submit">Выбрать</button>
  </form>
  <button class="btn danger" id="delBtn" hidden>Удалить выбранные</button>
  <button class="btn" id="undoBtn" hidden>Отменить</button>
  <button class="btn primary" id="saveBtn" hidden>Сохранить PDF</button>
</header>
<main id="main">
  <div class="empty" id="empty">
    <h1>PDF Cleaner</h1>
    <p>Перетащите PDF в окно или нажмите «Открыть PDF». Файл обрабатывается прямо в вашем браузере и никуда не отправляется.</p>
    <button class="btn primary" id="openBtn2">Открыть PDF</button>
  </div>
  <div class="grid" id="grid" hidden></div>
</main>
<footer id="status" role="status"></footer>
<div class="drop" id="drop">Отпустите, чтобы открыть PDF</div>
<input type="file" id="fileInput" accept=".pdf,application/pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js"; // воркер уже загружен скриптом выше

let pdf = null, bytes = null, fileName = "", pages = [], hist = [], sel = new Set();
let cards = new Map(), gen = 0, busy = false;

const io = new IntersectionObserver((es) => es.forEach((e) => {
  if (e.isIntersecting) { io.unobserve(e.target); enqueue(e.target); }
}), { root: $("main"), rootMargin: "400px" });

// Рендер миниатюр по очереди, чтобы интерфейс не зависал
const queue = []; let running = false;
function enqueue(card) { queue.push({ card, g: gen }); if (!running) run(); }
async function run() {
  running = true;
  while (queue.length) {
    const { card, g } = queue.shift();
    if (g !== gen) continue;
    try {
      const page = await pdf.getPage(card._i + 1);
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: (180 / base.width) * Math.min(devicePixelRatio || 1, 2) });
      const c = card.querySelector("canvas");
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      card.querySelector(".thumb").style.aspectRatio = `${vp.width} / ${vp.height}`;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      page.cleanup();
    } catch (e) { /* миниатюра не отрисовалась — страница всё равно останется в файле */ }
    await new Promise((r) => setTimeout(r)); // отдаём управление интерфейсу
  }
  running = false;
}

function say(text, kind = "") { const s = $("status"); s.textContent = text; s.className = kind; }

function parseRanges(input, total) {
  const text = input.trim();
  if (!text) return { error: "Введите номера страниц, например: 2, 5, 8-12" };
  const out = new Set();
  for (const part of text.split(/[,;\s]+/).filter(Boolean)) {
    const m = part.match(/^(\d+)(?:[-–—](\d+))?$/);
    if (!m) return { error: `Не удалось разобрать «${part}»` };
    const a = +m[1], b = m[2] !== undefined ? +m[2] : a;
    if (a < 1 || b < 1) return { error: "Нумерация начинается с 1" };
    if (a > b) return { error: `Диапазон «${part}» задан в обратном порядке` };
    if (b > total) return { error: `В документе только ${total} стр.` };
    for (let i = a; i <= b; i++) out.add(i);
  }
  return { pages: [...out].sort((x, y) => x - y) };
}

function makeCard(i) {
  const b = document.createElement("button");
  b.className = "card"; b._i = i;
  b.innerHTML = '<div class="thumb"><canvas></canvas></div><span class="num"></span>';
  b.onclick = () => { sel.has(i) ? sel.delete(i) : sel.add(i); render(); };
  io.observe(b);
  return b;
}

function render() {
  const grid = $("grid");
  const keep = new Set(pages);
  for (const [i, c] of cards) if (!keep.has(i) && c.parentNode) c.remove();
  pages.forEach((i, pos) => {
    const c = cards.get(i);
    c.classList.toggle("sel", sel.has(i));
    c.setAttribute("aria-pressed", sel.has(i));
    c.setAttribute("aria-label", `Страница ${pos + 1}`);
    c.querySelector(".num").textContent = pos + 1;
    grid.appendChild(c); // переставляет существующий узел, миниатюра не рисуется заново
  });
  $("fcount").textContent = `${pages.length} из ${pdf.numPages} стр.`;
  $("delBtn").textContent = "Удалить выбранные" + (sel.size ? ` (${sel.size})` : "");
  $("delBtn").disabled = sel.size === 0;
  $("undoBtn").disabled = hist.length === 0;
  $("saveBtn").disabled = busy || pages.length === pdf.numPages;
}

async function load(file) {
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") return say("Выберите файл в формате PDF.", "error");
  say("Открываю…");
  try {
    const b = new Uint8Array(await file.arrayBuffer());
    const doc = await pdfjsLib.getDocument({ data: b.slice() }).promise;
    if (pdf) pdf.destroy();
    gen++; queue.length = 0;
    pdf = doc; bytes = b; fileName = file.name;
    pages = Array.from({ length: doc.numPages }, (_, i) => i);
    hist = []; sel = new Set();
    cards.forEach((c) => (io.unobserve(c), c.remove())); cards = new Map();
    pages.forEach((i) => cards.set(i, makeCard(i)));
    $("fname").textContent = file.name; $("rangeInput").value = "";
    $("empty").hidden = true; $("grid").hidden = false;
    for (const id of ["file", "rangeForm", "delBtn", "undoBtn", "saveBtn"]) $(id).hidden = false;
    render();
    say("Нажимайте на страницы, чтобы выбрать ненужные");
  } catch (e) {
    const m = `${e && e.name} ${e && e.message}`;
    say(/password/i.test(m) ? "Файл защищён паролем — такие PDF не поддерживаются."
      : /Invalid PDF|InvalidPDF|header/i.test(m) ? "Не удалось прочитать файл: он повреждён или это не PDF."
      : "Ошибка: " + (e && e.message || e), "error");
  }
}

function deleteSelected() {
  if (!sel.size) return;
  if (sel.size >= pages.length) return say("Нельзя удалить все страницы документа.", "error");
  const n = sel.size;
  hist.push(pages); pages = pages.filter((i) => !sel.has(i)); sel = new Set();
  $("rangeInput").value = ""; render(); say(`Удалено страниц: ${n}`);
}
function undo() {
  if (!hist.length) return;
  pages = hist.pop(); sel = new Set(); render(); say("Последнее удаление отменено");
}

async function savePdf() {
  busy = true; render(); say("Готовлю файл…");
  try {
    const src = await PDFLib.PDFDocument.load(bytes, { updateMetadata: false });
    const out = await PDFLib.PDFDocument.create();
    (await out.copyPages(src, pages)).forEach((p) => out.addPage(p)); // страницы копируются как есть, без растеризации
    const blob = new Blob([await out.save()], { type: "application/pdf" });
    const filename = fileName.replace(/\.pdf$/i, "") + "_cleaned.pdf";
    let dl = null;
    try { dl = window.claude && (await claude.use("downloads")); } catch (e) {}
    if (dl) await dl.save({ filename, data: blob });
    else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }
    say(`Сохранено: ${filename} (${pages.length} стр.)`, "ok");
  } catch (e) {
    if (e && e.code === "declined") say("Сохранение отменено");
    else say("Не удалось сохранить: " + (e && e.message || e), "error");
  } finally { busy = false; render(); }
}

const pick = () => $("fileInput").click();
$("openBtn").onclick = $("openBtn2").onclick = pick;
$("fileInput").onchange = (e) => { load(e.target.files[0]); e.target.value = ""; };
$("delBtn").onclick = deleteSelected; $("undoBtn").onclick = undo; $("saveBtn").onclick = savePdf;
$("rangeForm").onsubmit = (e) => {
  e.preventDefault();
  const r = parseRanges($("rangeInput").value, pages.length);
  if (r.error) return say(r.error, "error");
  sel = new Set(r.pages.map((n) => pages[n - 1])); render(); say(`Выбрано страниц: ${r.pages.length}`);
};

let depth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); depth++; $("drop").classList.add("on"); });
addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; $("drop").classList.remove("on"); } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => { e.preventDefault(); depth = 0; $("drop").classList.remove("on"); load(e.dataTransfer.files[0]); });
addEventListener("keydown", (e) => {
  if (!pdf || e.target.tagName === "INPUT") return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
  else if (e.key === "Delete") deleteSelected();
});
</script>
</body>
</html>
